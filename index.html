<!DOCTYPE html>
<html lang="en">
<head>

    <title>Laundry Services</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <div class="nav-logo">Logo</div><div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">About Us</a>
            <a href="#">Contact Us</a>
        </div><div class="nav-user"><span class="username">Username</span></div>
    </div>

    <div class="hero">
        <div class="hero-left">
            <h1>Revitalize Your Clothes with Expert <span class="highlight">Laundry Services!</span></h1>
            <p>From premium dry cleaning to swift wash and fold, we deliver care and convenience. Schedule a pickup and rediscover the freshness of your clothes today!</p>
            <button class="book-btn" type="button">Book a service today!</button>
        </div><div class="hero-right">
            <svg viewBox="0 0 400 460" role="img" aria-label="Washing machine with a laundry basket">
                <!-- folded towels -->
                <rect x="90" y="20" width="150" height="14" rx="3" fill="#7fb3f0"/>
                <rect x="90" y="36" width="150" height="14" rx="3" fill="#1e88e5"/>
                <rect x="90" y="52" width="150" height="14" rx="3" fill="#f6c91c"/>
                <rect x="90" y="68" width="150" height="14" rx="3" fill="#ffd83d"/>
                <!-- detergent bottle -->
                <rect x="225" y="2" width="36" height="66" rx="12" fill="#f3f3f3"/>
                <!-- top panel -->
                <rect x="70" y="85" width="260" height="70" rx="18" fill="#f2f2f2"/>
                <circle cx="115" cy="120" r="12" fill="#f6c91c"/>
                <circle cx="155" cy="120" r="12" fill="#f6c91c"/>
                <rect x="230" y="108" width="70" height="24" rx="12" fill="#f6c91c"/>

                <rect x="60" y="145" width="280" height="250" rx="18" fill="#1e88e5"/>
                <circle cx="318" cy="175" r="10" fill="#f6c91c"/>

                <circle cx="200" cy="275" r="85" fill="#f4f4f4"/>
                <circle cx="200" cy="275" r="62" fill="#1565c0"/>
                <circle cx="200" cy="275" r="48" fill="#1e5fd0"/>
                <circle cx="218" cy="255" r="8" fill="#ffffff" opacity="0.6"/>
                <!-- basket and cloth -->
                <path d="M20 330 L150 330 L135 440 Q131 450 118 450 L52 450 Q40 450 38 440 Z" fill="#f2c500"/>
                <rect x="105" y="335" width="75" height="50" rx="10" fill="#4cd05a"/>
            </svg>
        </div>
    </div>

</html>
